spring:
  application:
    name: statagora
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/statagora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
statagora:
  translation:
    url: ${TRANSLATION_URL:http://127.0.0.1:5000}
    api-key: ${TRANSLATION_API_KEY:}
    enabled: ${TRANSLATION_ENABLED:true}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://econorank.com/api/auth/google/callback}
