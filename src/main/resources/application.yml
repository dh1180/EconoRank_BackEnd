spring:
  application:
    name: statagora
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/statagora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
statagora:
  admin:
    emails: ${ADMIN_EMAILS:mjdh1936@gmail.com}
  translation:
    provider: ${TRANSLATION_PROVIDER:auto}
    url: ${TRANSLATION_URL:}
    api-key: ${TRANSLATION_API_KEY:}
    deepl-api-key: ${DEEPL_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    enabled: ${TRANSLATION_ENABLED:true}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://econorank.com/login/oauth2/code/google}
