spring:
  application:
    name: statagora
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/statagora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
