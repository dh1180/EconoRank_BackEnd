name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: statagora_test
          POSTGRES_USER: statagora
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U statagora -d statagora_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify on H2
        if: matrix.database == 'h2'
        run: sh mvnw -B verify
      - name: Verify on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/statagora_test
          TEST_DATABASE_USERNAME: statagora
          TEST_DATABASE_PASSWORD: ci-test-only
        run: sh mvnw -B verify
